name: Build and Deploy Backend

on:
  # PRs run build + test + lint. Every deploy step in the shared workflow is
  # guarded by `github.event_name != 'pull_request'` and the image is built but
  # not pushed, so a PR run checks without deploying. Without this trigger the
  # gate would only run after the merge, which cannot block anything.
  pull_request:
    paths:
      - 'backend/**'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: production

jobs:
  build-and-deploy:
    uses: §§deploy_your_startup.github_username§§/§§deploy_your_startup.deploy_repo_name§§/.github/workflows/build-and-deploy-service.yml@main
    with:
      environment: ${{ github.event.inputs.environment || 'production' }}
      platforms: linux/amd64
      service: backend
      run_tests: true
      # Runs ./make.sh lint in the test image: ruff format --check, ruff check, ty.
      run_lint: true
    secrets:
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
