name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - deployment/**
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment which should be deployed'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy:
    uses: Deploy-your-Startup/deploy-your-startup/.github/workflows/deploy.yml@main
    with:
      environment: ${{ github.event.inputs.environment || inputs.environment }}
    secrets:
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
