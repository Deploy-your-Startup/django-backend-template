version: 2
# Batch routine updates monthly; security updates and automatic rebases stay enabled.
updates:
  - package-ecosystem: pip
    open-pull-requests-limit: 2
    directories:
      - /template/deployment
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: uv
    open-pull-requests-limit: 2
    directories:
      - /template/backend
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    open-pull-requests-limit: 2
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    directories:
      - /template/backend
    schedule:
      interval: monthly



  # Actions are pinned to commit SHAs; Dependabot keeps the SHAs and their tag comments current.
  - package-ecosystem: github-actions
    open-pull-requests-limit: 2
    directories:
      - /
      - /template
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
