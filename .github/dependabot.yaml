version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /template/deployment
    schedule:
      interval: weekly
    groups:
      python-dev-dependencies:
        dependency-type: development
      python-prod-dependencies:
        dependency-type: production
        
  - package-ecosystem: uv
    directories:
      - /template/backend
    schedule:
      interval: weekly
    groups:
      python-dev-dependencies:
        dependency-type: development
      python-prod-dependencies:
        dependency-type: production

  - package-ecosystem: docker
    directories:
      - /template/backend
    schedule:
      interval: weekly


