version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /backend
      - /deployment
    schedule:
      interval: weekly
    groups:
      python-dev-dependencies:
        dependency-type: development
      python-prod-dependencies:
        dependency-type: production
        
  - package-ecosystem: uv
    directories:
      - /backend
    schedule:
      interval: weekly
    groups:
      python-dev-dependencies:
        dependency-type: development
      python-prod-dependencies:
        dependency-type: production

  - package-ecosystem: "docker"
    directories:
      - "backend"
    schedule:
      interval: "weekly"


