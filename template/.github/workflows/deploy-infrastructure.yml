name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment which infrastructure should be deployed"
        required: true
        default: "production"
        type: choice
        options:
          - production

jobs:
  deploy-infrastructure:
    uses: ./.github/workflows/startup.yml
    with:
      operation: infrastructure
      environment: ${{ github.event.inputs.environment || inputs.environment }}
    secrets:
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
      packages: write
      id-token: write
