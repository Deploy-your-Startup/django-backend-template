name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/startup.yml'
      - deployment/**
      - '!deployment/shared-workflows.ref'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment which should be deployed'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy:
    uses: ./.github/workflows/startup.yml
    with:
      operation: deploy
      environment: ${{ github.event.inputs.environment || inputs.environment }}
    secrets:
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
      packages: write
      id-token: write
