version: 2
# Batch routine updates monthly; security updates and automatic rebases stay enabled.
updates:
  - package-ecosystem: pip
    open-pull-requests-limit: 2
    directories:
      - /deployment
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: uv
    open-pull-requests-limit: 2
    directories:
      - /backend
    schedule:
      interval: monthly
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    open-pull-requests-limit: 2
    # A new Python minor moves .python-version, requires-python and uv.lock
    # together with the image; Dependabot would only change the image.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    directories:
      - /backend
    schedule:
      interval: monthly
