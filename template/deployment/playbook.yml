---
# PROVISIONING INFRASTRUCTURE
- hosts: provision-infrastructure
  connection: local
  gather_facts: false
  tasks:
    - import_role:
        name: "hetzner-network"
      tags: infrastructure

    - import_role:
        name: "hetzner-server"
      vars:
        node_count: "{{ master_count }}"
        node_type: master
      tags: infrastructure

    - import_role:
        name: "hetzner-server"
      vars:
        node_count: "{{ worker_count }}"
        node_type: worker
      tags: infrastructure

    - import_role:
        name: "hetzner-firewall"
      tags: infrastructure

    - import_role:
        name: "hetzner-loadbalancer"
      when: create_load_balancer is defined and create_load_balancer
      tags: infrastructure

    # Private network mode points DNS at the tailnet instead — see the TAILNET
    # play below; no node has a tailnet address yet at this point.
    - import_role:
        name: "hetzner-dns"
      vars:
        loadbalancer_ip: "{{ load_balancer_result.hcloud_load_balancer.ipv4_address | default(hostvars[project_name + '-master-0']['ansible_host'])}}"
        domains: "{{ [base_domain] + additional_domains }}"
      when: (network_mode | default('public')) != 'private'
      tags: infrastructure

# CHECK INFRASTRUCTURE READY - WAIT FOR SSH ON ALL NODES
- hosts: hcloud
  gather_facts: false
  tasks:
    - name: "Wait for SSH to come up"
      wait_for:
        port: 22
        host: "{{ ansible_host }}"
        timeout: 300
      tags: infrastructure
      connection: local

# TAILNET - private network mode only; a no-op for public projects.
# Joins nodes that were not created on the tailnet, then points DNS at the
# master's tailnet address instead of the public IP the provisioning play uses.
- hosts: hcloud
  gather_facts: false
  tasks:
    - import_role:
        name: tailscale
      tags: infrastructure,tailscale

    - name: "Point DNS at the tailnet"
      include_role:
        name: hetzner-dns
        apply:
          delegate_to: localhost
          tags: infrastructure
      vars:
        loadbalancer_ip: "{{ tailscale_ipv4 }}"
        domains: "{{ [base_domain] + additional_domains }}"
      when:
        - (network_mode | default('public')) == 'private'
        - inventory_hostname == project_name + '-master-0'
      tags: infrastructure

# K3S INSTALLATION - SEQUENTIALLY!
- hosts: hcloud
  gather_facts: false
  serial: 1
  tasks:
    - import_role:
        name: k3s
      tags: infrastructure,k3s

# POST-K3S SETUP
- hosts: hcloud
  gather_facts: false
  tasks:
    # ONLY RUN ON MASTER NODES
    - name: "prepare kubeconfig for k8s ansible module"
      import_role:
        name: prepare-kubeconfig
      tags: infrastructure
      when: hcloud_labels.get("type") == "master"

    - name: "install python dependencies"
      import_role:
        name: python
      tags: infrastructure

    # ONlY RUN ONCE
    - import_role:
        name: "ingress"
      when: create_load_balancer is defined and create_load_balancer
      tags: infrastructure
      run_once: true

# DEPLOYMENT OF SERVICES
- hosts: hcloud_type_master
  run_once: true
  tasks:
    - name: "prepare Kubernetes client for service deployment"
      import_role:
        name: "kubernetes-client"
      tags: always

    - name: "create project namespace"
      import_role:
        name: "project-namespace"
      tags: always

    - name: "deploy docker-secrets"
      import_role:
        name: docker-secrets
      tags: docker-secrets,backend

    - name: "deploy cert-manager"
      import_role:
        name: cert-manager
      tags: cert-manager,backend

    - name: "deploy postgres"
      import_role:
        name: postgres
      tags: postgres,backend

    - name: "copy backend role into deployment"
      delegate_to: localhost
      become: false
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      ansible.builtin.copy:
        src: ../backend/deployment/
        dest: ./roles/backend
      tags: backend

    - name: "deploy backend"
      include_role:
        name: backend
      tags: backend
