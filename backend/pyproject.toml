[project]
name = "backend"
version = "0.0.1"
description = ""
requires-python = "~=3.14.0"
dependencies = [
    "dj-database-url>=2.3.0,<4",
    "sentry-sdk>=2.20.0,<3",
    "websockets~=16.0",
    "redis>=5.2.1,<8",
    "async-timeout>=4.0.3,<6",
    "uvicorn[standard]>=0.34.0,<0.41",
    "fastapi>=0.115.6,<0.130",
    "pillow>=11.1.0,<13",
    "django>=6.0",
    "django-bootstrap5>=26.1",
    "psycopg[binary]>=3.3.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.1.0,<5",
    "docker>=7.1.0,<8",
    "httpx>=0.28.1,<0.29",
    "pytest>=8.3.4,<10",
    "factory-boy>=3.3.1,<4",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = ["I", "E", "F", "B", "UP"]
ignore = ["E501"]
