[project]
name = "backend"
version = "0.0.1"
description = ""
requires-python = "~=3.14.0"
dependencies = [
    "dj-database-url>=3.1.2,<4",
    "sentry-sdk>=2.59.0,<3",
    "websockets~=16.0",
    "redis>=7.4.0,<8",
    "async-timeout>=5.0.1,<6",
    "uvicorn[standard]>=0.46.0,<0.47",
    "fastapi>=0.136.1,<0.137",
    "pillow>=12.2.0,<13",
    "django>=6.0.4",
    "django-bootstrap5>=26.2",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0,<5",
    "docker>=7.1.0,<8",
    "httpx>=0.28.1,<0.29",
    "pytest>=9.0.3,<10",
    "factory-boy>=3.3.3,<4",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = ["I", "E", "F", "B", "UP"]
ignore = ["E501"]
