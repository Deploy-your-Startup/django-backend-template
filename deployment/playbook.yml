---
# PROVISIONING INFRASTRUCTURE is handled by OpenTofu (tofu/), run by the
# `startup ansible infrastructure` command before this playbook. It provisions
# network, servers, firewall, load balancer and DNS, and labels nodes with
# ingress=true / type=<role> so the dynamic inventory and the plays below match.

# CHECK INFRASTRUCTURE READY - WAIT FOR SSH ON ALL NODES
- hosts: hcloud
  gather_facts: false
  tasks:
    - name: "Wait for SSH to come up"
      wait_for:
        port: 22
        host: "{{ ansible_host }}"
        timeout: 300
      tags: infrastructure
      connection: local

# K3S INSTALLATION - SEQUENTIALLY!
- hosts: hcloud
  gather_facts: false
  serial: 1
  tasks:
    - import_role:
        name: k3s
      tags: infrastructure,k3s

# POST-K3S SETUP
- hosts: hcloud
  gather_facts: false
  tasks:
    # ONLY RUN ON MASTER NODES
    - name: "prepare kubeconfig for k8s ansible module"
      import_role:
        name: prepare-kubeconfig
      tags: infrastructure
      when: hcloud_labels.get("type") == "master"

    - name: "install python dependencies"
      import_role:
        name: python
      tags: infrastructure

    # ONlY RUN ONCE
    - import_role:
        name: "ingress"
      when: create_load_balancer is defined and create_load_balancer
      tags: infrastructure
      run_once: true

    - name: "deploy hetzner-csi-provider"
      import_role:
        name: hetzner-csi-provider
      tags: infrastructure
      run_once: true

# DEPLOYMENT OF SERVICES
- hosts: hcloud_type_master
  run_once: true
  tasks:
    - name: "deploy docker-secrets"
      import_role:
        name: docker-secrets
      tags: docker-secrets

    - name: "deploy cert-manager"
      import_role:
        name: cert-manager
      tags: cert-manager

    - name: "deploy postgres"
      import_role:
        name: postgres
      tags: postgres

    - name: "copy backend role into deployment"
      connection: local
      copy:
        src: ../backend/deployment/
        dest: ./roles/backend
      tags: backend

    - name: "deploy backend"
      include_role:
        name: backend
      tags: backend
